<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti 💖</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial;
  color: white;
  text-align: center;
}

/* Título */
h1 {
  margin-top: 40px;
  font-size: 50px;
  color: red;
  text-shadow: 0 0 20px red, 0 0 40px pink;
}

/* Botón */
button {
  margin-top: 20px;
  padding: 15px 30px;
  font-size: 20px;
  background: pink;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 0 15px pink;
}

/* Mensaje oculto */
#mensaje {
  display: none;
  position: absolute;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.8);
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 0 20px yellow;
}

#foto {
  width: 300px;
  height: 300px;
  object-fit: cover;
  border-radius: 15px;
  margin-top: 10px;
}

/* Frases */
.frase {
  position: absolute;
  font-size: 20px;
  color: white;
  animation: flotar 6s linear infinite;
}

@keyframes flotar {
  0% { transform: translateY(100vh); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* Estrellas */
.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: red;
  animation: parpadeo 2s infinite;
}

@keyframes parpadeo {
  0%,100% { opacity: 0.2; }
  50% { opacity: 1; }
}

/* Flores */
.flor {
  position: absolute;
  font-size: 65px;
  animation: caer 8s linear infinite;
  cursor: pointer;
  user-select: none;
  z-index: 5;
  transition: transform 0.3s;
}

.flor:hover {
  transform: scale(1.3);
}

/* Ventana romántica */
#ventanaRomantica {
  display: none;
  position: fixed;
  z-index: 1000;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 350px;
  max-width: 85%;
  padding: 25px;
  background: rgba(20, 10, 20, 0.95);
  border: 2px solid pink;
  border-radius: 20px;
  box-shadow: 0 0 30px pink;
  animation: aparecer 0.5s ease;
}

#ventanaRomantica img {
  width: 320px;
  height: 320px;
  object-fit: contain;
  background: black;
  border-radius: 15px;
  margin-bottom: 15px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

#fraseRomantica {
  font-size: 22px;
  color: #fff;
  line-height: 1.5;
  text-shadow: 0 0 10px pink;
}

#cerrarVentana {
  margin-top: 15px;
  padding: 10px 20px;
  background: pink;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

@keyframes aparecer {
  from {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
  }

  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}
@keyframes caer {
  0% { transform: translateY(-10vh); }
  100% { transform: translateY(110vh); }
}

@media (max-width: 600px) {
  #ventanaRomantica {
    width: 85%;
    padding: 15px;
  }

  #ventanaRomantica img {
    width: 100%;
    height: 300px;
    object-fit: contain;
  }

  #fraseRomantica {
    font-size: 18px;
  }
}
</style>

</head>

<body>

// Crear girasoles

      Math.floor(Math.random() * floresRomanticas.length)
    ];

  // Cuando se toca el girasol
  flor.addEventListener("click", function() {

    document.getElementById("imagenRomantica").src =
      sorpresa.imagen;

    document.getElementById("fraseRomantica").innerText =
      sorpresa.frase;

    document.getElementById("ventanaRomantica").style.display =
      "block";

    flor.remove();

// =========================================

function cerrarVentana() {

    "none";

}

// INTERACCIÓN CON EL MOUSE (movimiento en pantalla)
document.addEventListener("mousemove", function(e) {
  let spark = document.createElement("div");
  spark.className = "star";
  spark.style.left = e.pageX + "px";
  spark.style.top = e.pageY + "px";
  spark.style.background = "white";

});
